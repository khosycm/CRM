<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran SMP Islam Cendekia Muda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background-color: #f8fafc; color: #1e293b; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%); }
    .gradient-text { background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
  </style>
</head>
<body class="antialiased min-h-screen gradient-bg py-10 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
  <div class="max-w-4xl w-full">
    <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-10 text-white text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full bg-black opacity-10"></div>
        <h1 class="text-4xl font-extrabold tracking-tight relative z-10">Formulir Pendaftaran</h1>
        <p class="mt-3 text-emerald-100 text-lg relative z-10 font-medium">SMP Islam Cendekia Muda</p>
      </div>
      
      <form id="registrationForm" class="p-8 sm:p-12 space-y-10">
        <input type="hidden" name="formType" value="SMP">
        <input type="hidden" name="leadId" id="leadId">
        <input type="hidden" name="unitTujuan" id="unitTujuan">
        
        <!-- Data Anak -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Siswa</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Siswa</label><input type="text" name="Nama Lengkap Siswa" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white" required></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Panggilan</label><input type="text" name="Nama Panggilan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir</label><input type="text" name="Tempat Lahir" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir</label><input type="date" name="Tanggal Lahir" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Kelamin</label>
              <select name="Jenis Kelamin" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>
            <div><label class="block text-sm font-medium text-slate-700">No. Telepon Siswa</label><input type="tel" name="No. Telepon Siswa" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Akta Kelahiran</label><input type="text" name="No. Akta Kelahiran" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Kartu Keluarga</label><input type="text" name="No. Kartu Keluarga" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. NIK Siswa</label><input type="text" name="No. NIK Siswa" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            
            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Upload Dokumen</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Akta Kelahiran</label><input type="file" name="Akta Kelahiran" class="mt-1.5 block w-full border border-slate-300 rounded-lg p-2.5 bg-white/50 focus:bg-white transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Kartu Keluarga</label><input type="file" name="Kartu Keluarga" class="mt-1.5 block w-full border border-slate-300 rounded-lg p-2.5 bg-white/50 focus:bg-white transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"></div>

            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Nilai Rapor</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Nilai Rapor Kelas 5 Ganjil</label><input type="text" name="Nilai Rapor Kelas 5 Ganjil" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nilai Rapor Kelas 5 Genap</label><input type="text" name="Nilai Rapor Kelas 5 Genap" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nilai Rapor Kelas 6 Ganjil</label><input type="text" name="Nilai Rapor Kelas 6 Ganjil" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            
            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Keluarga & Pribadi</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Anak Ke</label><input type="number" name="Anak Ke" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jumlah Saudara Kandung</label><input type="number" name="Jumlah Saudara Kandung" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jumlah Saudara Tiri</label><input type="number" name="Jumlah Saudara Tiri" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jumlah Saudara Angkat</label><input type="number" name="Jumlah Saudara Angkat" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Status Dalam Keluarga</label><input type="text" name="Status Dalam Keluarga" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Bahasa Sehari-hari</label><input type="text" name="Bahasa Sehari-hari" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kewarganegaraan</label><input type="text" name="Kewarganegaraan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Asal Negara WNA</label><input type="text" name="Asal Negara WNA" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tinggi Badan</label><input type="text" name="Tinggi Badan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Berat Badan</label><input type="text" name="Berat Badan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Golongan Darah</label><input type="text" name="Golongan Darah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Alamat Siswa</label><textarea name="Alamat Siswa" rows="2" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></textarea></div>
            <div><label class="block text-sm font-medium text-slate-700">Kelurahan</label><input type="text" name="Kelurahan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kecamatan</label><input type="text" name="Kecamatan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kab/Kota</label><input type="text" name="Kab/Kota" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kode POS</label><input type="text" name="Kode POS" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Tinggal</label><input type="text" name="Jenis Tinggal" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Alat Transportasi ke Sekolah</label><input type="text" name="Alat Transportasi ke Sekolah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jarak Tempat Tinggal ke Sekolah</label><input type="text" name="Jarak Tempat Tinggal ke Sekolah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Waktu Tempuh</label><input type="text" name="Waktu Tempuh" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            
            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Prestasi & Tambahan</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Minat dan Bakat Siswa</label><input type="text" name="Minat dan Bakat Siswa" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kelainan Jasmani</label><input type="text" name="Kelainan Jasmani" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Prestasi</label><input type="text" name="Jenis Prestasi" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tingkat Prestasi</label><input type="text" name="Tingkat Prestasi" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Nama Prestasi/Tahun/Penyelenggara</label><input type="text" name="Nama Prestasi/Tahun/Penyelenggara" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Sekolah Dasar Asal</label><input type="text" name="Nama Sekolah Dasar Asal" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Alamat Sekolah Dasar Asal</label><input type="text" name="Alamat Sekolah Dasar Asal" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Tamat Sekolah Dasar</label><input type="date" name="Tanggal Tamat Sekolah Dasar" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
          </div>
        </div>

        <!-- Data Ayah -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Ayah</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Status Ayah</label><input type="text" name="Status Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ayah</label><input type="text" name="Nama Lengkap Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir Ayah</label><input type="text" name="Tempat Lahir Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ayah</label><input type="date" name="Tanggal Lahir Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Agama Ayah</label><input type="text" name="Agama Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Telepon Ayah</label><input type="tel" name="No. Telepon Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Alamat Rumah Ayah</label><textarea name="Alamat Rumah Ayah" rows="2" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></textarea></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan Ayah</label><input type="text" name="Pekerjaan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Instansi/Perusahaan Ayah</label><input type="text" name="Nama Instansi/Perusahaan/Lembaga/Wirausaha Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jabatan Ayah</label><input type="text" name="Jabatan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Alamat Instansi Ayah</label><input type="text" name="Alamat Instansi Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ayah</label><input type="text" name="Penghasilan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenjang Pendidikan Ayah</label><input type="text" name="Jenjang Pendidikan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kewarganegaraan Ayah</label><input type="text" name="Kewarganegaraan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Asal Negara WNA Ayah</label><input type="text" name="Asal Negara WNA Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
          </div>
        </div>

        <!-- Data Ibu -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Ibu</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Status Ibu</label><input type="text" name="Status Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ibu</label><input type="text" name="Nama Lengkap Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>

        <div id="alertBox" class="hidden rounded-xl p-4 text-sm font-medium shadow-sm transition-all duration-300"></div>

          <button type="submit" id="submitBtn" class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-lg text-lg font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform hover:-translate-y-0.5">
            <i class="fa-solid fa-paper-plane"></i>
            Kirim Pendaftaran
          </button>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('leadId')) {
        document.getElementById('leadId').value = urlParams.get('leadId');
      }
      if (urlParams.has('unit')) {
        document.getElementById('unitTujuan').value = urlParams.get('unit');
      }

      document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';
        alertBox.classList.add('hidden');
        
        try {
          const formData = new FormData(form);
          const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if (response.ok) {
            alertBox.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>' + (result.message || 'Pendaftaran berhasil dikirim!');
            alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-emerald-50 text-emerald-800 border border-emerald-200';
            form.reset();
          } else {
            alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>' + (result.message || 'Terjadi kesalahan.');
            alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-rose-50 text-rose-800 border border-rose-200';
          }
        } catch (error) {
          alertBox.innerHTML = '<i class="fa-solid fa-wifi mr-2"></i> Terjadi kesalahan jaringan.';
          alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-rose-50 text-rose-800 border border-rose-200';
        } finally {
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        }
      });
    });
  </script>
