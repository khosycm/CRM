<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran TK Islam Cendekia Muda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="antialiased text-slate-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
      <div class="bg-gradient-to-r from-emerald-500 to-teal-600 p-8 text-white text-center">
        <h1 class="text-3xl font-bold tracking-tight">Formulir Pendaftaran</h1>
        <p class="mt-2 text-emerald-50 text-lg">TK Islam Cendekia Muda</p>
      </div>
      
      <form id="registrationForm" class="p-8 space-y-8" enctype="multipart/form-data">
        <input type="hidden" name="formType" value="TK">
        <input type="hidden" name="leadId" id="leadId">
        
        <!-- Data Anak -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Anak</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Anak</label><input type="text" name="Nama Lengkap Anak" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" required></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Panggilan</label><input type="text" name="Nama Panggilan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kelas</label><input type="text" name="Kelas" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir</label><input type="text" name="Tempat Lahir" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir</label><input type="date" name="Tanggal Lahir" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Kelamin</label>
              <select name="Jenis Kelamin" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>
            <div><label class="block text-sm font-medium text-slate-700">Golongan Darah</label><input type="text" name="Gologan Darah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Hobi</label><input type="text" name="Hobi" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Cita Cita</label><input type="text" name="Cita Cita" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. NIK</label><input type="text" name="No. NIK" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Kartu Keluarga</label><input type="text" name="No. Kartu Keluarga" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Akta Kelahiran</label><input type="text" name="No. Akta Kelahiran" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Anak ke Berapa Berdasarkan KK</label><input type="number" name="Anak ke Berapa Berdasarkan KK" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jumlah Saudara Kandung</label><input type="number" name="Jumlah Saudara Kandung" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Alamat Rumah</label><textarea name="Alamat Rumah" rows="2" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></textarea></div>
            <div><label class="block text-sm font-medium text-slate-700">RT</label><input type="text" name="RT" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">RW</label><input type="text" name="RW" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kelurahan</label><input type="text" name="Kelurahan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kecamatan</label><input type="text" name="Kecamatan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kab/Kota</label><input type="text" name="Kab/Kota" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kode POS</label><input type="text" name="Kode POS" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            
            <div><label class="block text-sm font-medium text-slate-700">Jenis Tinggal</label><input type="text" name="Jenis Tinggal" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Alat Transportasi ke Sekolah</label><input type="text" name="Alat Transportasi ke Sekolah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jarak Tempat Tinggal ke Sekolah</label><input type="text" name="Jarak Tempat Tinggal ke Sekolah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Waktu Tempuh</label><input type="text" name="Waktu Tempuh" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Berat Badan</label><input type="text" name="Berat Badan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tinggi Badan</label><input type="text" name="Tinggi Badan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Lingkar Kepala</label><input type="text" name="Lingkar Kepala" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Berkebutuhan Khusus</label><input type="text" name="Berkebutuhan Khusus" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
          </div>
        </div>

        <!-- Dokumen -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Upload Dokumen</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Upload Kartu Keluarga</label><input type="file" name="Kartu Keluarga" class="mt-1 block w-full p-2 border border-slate-300 rounded-md"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Akta Kelahiran</label><input type="file" name="Akta Kelahiran" class="mt-1 block w-full p-2 border border-slate-300 rounded-md"></div>
          </div>
        </div>

        <!-- Data Ayah -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Ayah/Wali</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Ayah/Wali</label><input type="text" name="Nama Ayah/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ayah</label><input type="date" name="Tanggal Lahir Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. NIK Ayah</label><input type="text" name="No. NIK Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan Ayah/Wali</label><input type="text" name="Pekerjaan Ayah/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ayah/Wali</label><input type="text" name="Penghasilan Ayah/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ayah/Wali</label><input type="text" name="Pendidikan Terakhir Ayah/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Telepon Ayah</label><input type="tel" name="No. Telepon Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">KTP Ayah (No)</label><input type="text" name="KTP Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
          </div>
        </div>

        <!-- Data Ibu -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Ibu/Wali</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Ibu/Wali</label><input type="text" name="Nama Ibu/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ibu</label><input type="date" name="Tanggal Lahir Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. NIK Ibu</label><input type="text" name="No. NIK Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan Ibu/Wali</label><input type="text" name="Pekerjaan Ibu/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ibu/Wali</label><input type="text" name="Penghasilan Ibu/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ibu/Wali</label><input type="text" name="Pendidikan Terakhir Ibu/Wali" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">No. Telepon Ibu</label><input type="tel" name="No. Telepon Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">KTP Ibu (No)</label><input type="text" name="KTP Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
          </div>
        </div>

        <div id="alertBox" class="hidden rounded-md p-4 text-sm font-medium"></div>

        <div>
          <button type="submit" id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
            Kirim Pendaftaran
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('leadId')) {
        document.getElementById('leadId').value = urlParams.get('leadId');
      }

      document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Mengirim...';
        alertBox.classList.add('hidden');
        
        try {
          const formData = new FormData(form);
          const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if (response.ok) {
            alertBox.innerHTML = result.message || 'Pendaftaran berhasil dikirim!';
            alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-green-50 text-green-800';
            form.reset();
          } else {
            alertBox.innerHTML = result.message || 'Terjadi kesalahan.';
            alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-red-50 text-red-800';
          }
        } catch (error) {
          alertBox.innerHTML = 'Terjadi kesalahan jaringan.';
          alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-red-50 text-red-800';
        } finally {
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Kirim Pendaftaran';
        }
      });
    });
  </script>
</body>
</html>
