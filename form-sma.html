<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran SMA Islam Cendekia Muda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background-color: #f8fafc; color: #1e293b; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%); }
    .gradient-text { background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
  </style>
</head>
<body class="antialiased min-h-screen gradient-bg py-10 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
  <div class="max-w-4xl w-full">
    <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-10 text-white text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-full bg-black opacity-10"></div>
        <h1 class="text-4xl font-extrabold tracking-tight relative z-10">Formulir Pendaftaran</h1>
        <p class="mt-3 text-emerald-100 text-lg relative z-10 font-medium">SMA Islam Cendekia Muda</p>
      </div>
      
      <form id="registrationForm" class="p-8 sm:p-12 space-y-10">
        <input type="hidden" name="formType" value="SMA">
        <input type="hidden" name="leadId" id="leadId">
        <input type="hidden" name="unitTujuan" id="unitTujuan">
        
        <!-- Data Siswa -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Siswa</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap</label><input type="text" name="Nama Lengkap" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white" required></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Panggilan</label><input type="text" name="Nama Panggilan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir</label><input type="text" name="Tempat Lahir" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir</label><input type="date" name="Tanggal Lahir" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Kelamin</label>
              <select name="Jenis Kelamin" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>
            <div><label class="block text-sm font-medium text-slate-700">Agama</label><input type="text" name="Agama" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Bahasa Sehari-hari</label><input type="text" name="Bahasa Sehari-hari" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kewarganegaraan</label><input type="text" name="Kewarganegaraan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tinggi Badan (cm)</label><input type="text" name="Tinggi Badan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Berat Badan (kg)</label><input type="text" name="Berat Badan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Golongan Darah</label><input type="text" name="Golongan Darah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">NISN</label><input type="text" name="NISN" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Sekolah Asal</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Asal SMP</label><input type="text" name="Asal SMP" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Tamat SMP</label><input type="date" name="Tanggal Tamat SMP" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Alamat SMP</label><textarea name="Alamat SMP" rows="2" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></textarea></div>
            
            <div class="sm:col-span-2 mt-4"><h3 class="text-xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6">Upload Dokumen</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Akta Lahir Siswa</label><input type="file" name="Akta Lahir Siswa" class="mt-1.5 block w-full border border-slate-300 rounded-lg p-2.5 bg-white/50 focus:bg-white transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Kartu Keluarga</label><input type="file" name="Kartu Keluarga" class="mt-1.5 block w-full border border-slate-300 rounded-lg p-2.5 bg-white/50 focus:bg-white transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Pas Foto</label><input type="file" name="Pas Foto" class="mt-1.5 block w-full border border-slate-300 rounded-lg p-2.5 bg-white/50 focus:bg-white transition-colors text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100"></div>
          </div>
        </div>

        <!-- Data Ayah -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Ayah</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ayah</label><input type="text" name="Nama Lengkap Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir Ayah</label><input type="text" name="Tempat Lahir Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ayah</label><input type="date" name="Tanggal Lahir Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan/Profesi Ayah</label><input type="text" name="Pekerjaan/Profesi Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Nama & Alamat Tempat Kerja Ayah</label><input type="text" name="Nama & Alamat Tempat Kerja Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ayah</label><input type="text" name="Penghasilan Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ayah</label><input type="text" name="Pendidikan Terakhir Ayah" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
          </div>
        </div>

        <!-- Data Ibu -->
        <div>
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-emerald-100 pb-3 mb-6 flex items-center gap-2">Data Ibu</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ibu</label><input type="text" name="Nama Lengkap Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir Ibu</label><input type="text" name="Tempat Lahir Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ibu</label><input type="date" name="Tanggal Lahir Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan/Profesi Ibu</label><input type="text" name="Pekerjaan/Profesi Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Nama & Alamat Tempat Kerja Ibu</label><input type="text" name="Nama & Alamat Tempat Kerja Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ibu</label><input type="text" name="Penghasilan" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ibu</label><input type="text" name="Pendidikan Terakhir Ibu" class="mt-1.5 block w-full rounded-lg border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2.5 border transition-colors bg-white/50 focus:bg-white"></div>
          </div>
        </div>

        <div id="alertBox" class="hidden rounded-xl p-4 text-sm font-medium shadow-sm transition-all duration-300"></div>

        <div class="pt-4">
          <button type="submit" id="submitBtn" class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-xl shadow-lg text-lg font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform hover:-translate-y-0.5">
            <i class="fa-solid fa-paper-plane"></i>
            Kirim Pendaftaran
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('leadId')) {
        document.getElementById('leadId').value = urlParams.get('leadId');
      }
      if (urlParams.has('unit')) {
        document.getElementById('unitTujuan').value = urlParams.get('unit');
      }

      document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';
        alertBox.classList.add('hidden');
        
        try {
          const formData = new FormData(form);
          const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if (response.ok) {
            alertBox.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>' + (result.message || 'Pendaftaran berhasil dikirim!');
            alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-emerald-50 text-emerald-800 border border-emerald-200';
            form.reset();
          } else {
            alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>' + (result.message || 'Terjadi kesalahan.');
            alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-rose-50 text-rose-800 border border-rose-200';
          }
        } catch (error) {
          alertBox.innerHTML = '<i class="fa-solid fa-wifi mr-2"></i> Terjadi kesalahan jaringan.';
          alertBox.className = 'mt-6 rounded-xl p-4 text-sm font-bold bg-rose-50 text-rose-800 border border-rose-200';
        } finally {
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        }
      });
    });
  </script>
</body>
</html>
