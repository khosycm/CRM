<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran SMA Islam Cendekia Muda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="antialiased text-slate-800">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
      <div class="bg-gradient-to-r from-emerald-500 to-teal-600 p-8 text-white text-center">
        <h1 class="text-3xl font-bold tracking-tight">Formulir Pendaftaran</h1>
        <p class="mt-2 text-emerald-50 text-lg">SMA Islam Cendekia Muda</p>
      </div>
      
      <form id="registrationForm" class="p-8 space-y-8" enctype="multipart/form-data">
        <input type="hidden" name="formType" value="SMA">
        <input type="hidden" name="leadId" id="leadId">
        
        <!-- Data Siswa -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Siswa</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap</label><input type="text" name="Nama Lengkap" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm p-2 border" required></div>
            <div><label class="block text-sm font-medium text-slate-700">Nama Panggilan</label><input type="text" name="Nama Panggilan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir</label><input type="text" name="Tempat Lahir" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir</label><input type="date" name="Tanggal Lahir" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Jenis Kelamin</label>
              <select name="Jenis Kelamin" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border">
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
              </select>
            </div>
            <div><label class="block text-sm font-medium text-slate-700">Agama</label><input type="text" name="Agama" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Bahasa Sehari-hari</label><input type="text" name="Bahasa Sehari-hari" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Kewarganegaraan</label><input type="text" name="Kewarganegaraan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tinggi Badan (cm)</label><input type="text" name="Tinggi Badan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Berat Badan (kg)</label><input type="text" name="Berat Badan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Golongan Darah</label><input type="text" name="Golongan Darah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">NISN</label><input type="text" name="NISN" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div class="sm:col-span-2 border-t mt-4 pt-4"><h3 class="font-medium text-slate-800">Sekolah Asal</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Asal SMP</label><input type="text" name="Asal SMP" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Tamat SMP</label><input type="date" name="Tanggal Tamat SMP" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Alamat SMP</label><textarea name="Alamat SMP" rows="2" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></textarea></div>
            
            <div class="sm:col-span-2 border-t mt-4 pt-4"><h3 class="font-medium text-slate-800">Upload Dokumen</h3></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Akta Lahir Siswa</label><input type="file" name="Akta Lahir Siswa" class="mt-1 block w-full border border-slate-300 rounded-md p-2"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Kartu Keluarga</label><input type="file" name="Kartu Keluarga" class="mt-1 block w-full border border-slate-300 rounded-md p-2"></div>
            <div><label class="block text-sm font-medium text-slate-700">Upload Pas Foto</label><input type="file" name="Pas Foto" class="mt-1 block w-full border border-slate-300 rounded-md p-2"></div>
          </div>
        </div>

        <!-- Data Ayah -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Ayah</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ayah</label><input type="text" name="Nama Lengkap Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir Ayah</label><input type="text" name="Tempat Lahir Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ayah</label><input type="date" name="Tanggal Lahir Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan/Profesi Ayah</label><input type="text" name="Pekerjaan/Profesi Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Nama & Alamat Tempat Kerja Ayah</label><input type="text" name="Nama & Alamat Tempat Kerja Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ayah</label><input type="text" name="Penghasilan Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ayah</label><input type="text" name="Pendidikan Terakhir Ayah" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
          </div>
        </div>

        <!-- Data Ibu -->
        <div>
          <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 mb-4">Data Ibu</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-slate-700">Nama Lengkap Ibu</label><input type="text" name="Nama Lengkap Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tempat Lahir Ibu</label><input type="text" name="Tempat Lahir Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Tanggal Lahir Ibu</label><input type="date" name="Tanggal Lahir Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pekerjaan/Profesi Ibu</label><input type="text" name="Pekerjaan/Profesi Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700">Nama & Alamat Tempat Kerja Ibu</label><input type="text" name="Nama & Alamat Tempat Kerja Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Penghasilan Ibu</label><input type="text" name="Penghasilan" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
            <div><label class="block text-sm font-medium text-slate-700">Pendidikan Terakhir Ibu</label><input type="text" name="Pendidikan Terakhir Ibu" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm p-2 border"></div>
          </div>
        </div>

        <div id="alertBox" class="hidden rounded-md p-4 text-sm font-medium"></div>

        <div>
          <button type="submit" id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
            Kirim Pendaftaran
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('leadId')) {
        document.getElementById('leadId').value = urlParams.get('leadId');
      }

      document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Mengirim...';
        alertBox.classList.add('hidden');
        
        try {
          const formData = new FormData(form);
          const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          
          const result = await response.json();
          if (response.ok) {
            alertBox.innerHTML = result.message || 'Pendaftaran berhasil dikirim!';
            alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-green-50 text-green-800';
            form.reset();
          } else {
            alertBox.innerHTML = result.message || 'Terjadi kesalahan.';
            alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-red-50 text-red-800';
          }
        } catch (error) {
          alertBox.innerHTML = 'Terjadi kesalahan jaringan.';
          alertBox.className = 'mt-4 rounded-md p-4 text-sm font-medium bg-red-50 text-red-800';
        } finally {
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Kirim Pendaftaran';
        }
      });
    });
  </script>
</body>
</html>
